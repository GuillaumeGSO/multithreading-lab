# SEARCH_MODE (baseline | parallel, plus indexed for python/java/csharp) means the
# same thing in every implementation; see the root README. It defaults to
# parallel; load-tests/run-all.sh sets it per profile.
services:
  python:
    build:
      context: .
      dockerfile: python/Dockerfile
    # Already pinned to 2 via `uvicorn --workers 2` (Dockerfile); threads are
    # GIL-bound, so there is no host-core auto-sizing to cap here.
    environment:
      SEARCH_MODE: ${SEARCH_MODE:-parallel}
    ports:
      - "8007:8007"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8007/health', timeout=3)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512m

  java:
    build:
      context: .
      dockerfile: java/Dockerfile
    # Pin parallelism to the 2-CPU budget for a fair cross-language comparison.
    # JAVA_TOOL_OPTIONS is honored by every JVM launch (live API + benchmark).
    environment:
      JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=2"
      SEARCH_MODE: ${SEARCH_MODE:-parallel}
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8002/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512m

  go:
    build:
      context: .
      dockerfile: go/Dockerfile
    # GOMAXPROCS defaults to the HOST core count and ignores the cgroup CPU limit,
    # so pin it to 2 to match the budget (the main fairness fix).
    environment:
      GOMAXPROCS: "2"
      SEARCH_MODE: ${SEARCH_MODE:-parallel}
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD", "/app/search", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512m

  nest:
    build:
      context: .
      dockerfile: nest/Dockerfile
    # Worker pool already defaults to 2; set it explicitly to match the budget.
    environment:
      WORKER_POOL_SIZE: "2"
      SEARCH_MODE: ${SEARCH_MODE:-parallel}
    ports:
      - "8006:8006"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8006/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512m

  csharp:
    build:
      context: .
      dockerfile: csharp/Dockerfile
    # DOTNET_PROCESSOR_COUNT pins the .NET thread pool and GC to the 2-CPU budget
    # (equivalent to GOMAXPROCS=2 — .NET reads host core count, not the cgroup).
    environment:
      DOTNET_PROCESSOR_COUNT: "2"
      SEARCH_MODE: ${SEARCH_MODE:-parallel}
    ports:
      - "8005:8005"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8005/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512m

