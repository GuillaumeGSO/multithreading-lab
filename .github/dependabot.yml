# Weekly dependency updates for every ecosystem in the repo.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: [/python, /java, /go, /nest, /csharp]
    schedule: { interval: weekly }
  - package-ecosystem: uv
    directory: /python
    schedule: { interval: weekly }
  - package-ecosystem: gomod
    directory: /go
    schedule: { interval: weekly }
  - package-ecosystem: maven
    directory: /java
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directories: [/nest, /load-tests]
    schedule: { interval: weekly }
    # Nest packages share peer ranges (TypeScript, @fastify/static); bump them in one PR.
    groups:
      nestjs:
        patterns: ["@nestjs/*", "typescript", "@fastify/static"]
  - package-ecosystem: nuget
    directory: /csharp
    schedule: { interval: weekly }
