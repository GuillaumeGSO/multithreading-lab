name: Images

# Publishes every service image to GHCR once CI has passed on master, as
# ghcr.io/<owner>/multithreading-lab-<service>:{latest,sha-<short>}.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.service }}
    # Manual runs publish the selected ref; CI-triggered runs only on success.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [python, java, go, nest, csharp]
    steps:
      - uses: actions/checkout@v7
        with:
          # Build exactly the commit CI tested, not whatever master is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Image name and tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/multithreading-lab-${{ matrix.service }}"
          sha=$(git rev-parse --short HEAD)
          echo "tags=$image:latest,$image:sha-$sha" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Links the package to this repo on GHCR.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
